name: drone-seek-course
services:
  course:
    image: drone-seek:course
    build:
      context: ../..
      dockerfile: docker/course/Dockerfile
      args:
        BASE_IMAGE: ${COURSE_BASE_IMAGE:-rpg_isaac:vbdf-student}
    init: true
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /tmp/course.xauth
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-71}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      # The original checkout remains available for checkpoints and results.
      - ../..:/worktree
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${COURSE_XAUTHORITY:-/tmp/drone-seek-course.xauth}:/tmp/course.xauth:ro
      - /etc/localtime:/etc/localtime:ro
      - kit-cache:/isaac-sim/kit/cache
      - ov-cache:/root/.cache/ov
      - pip-cache:/root/.cache/pip
      - gl-cache:/root/.cache/nvidia/GLCache
      - compute-cache:/root/.nv/ComputeCache
volumes:
  kit-cache:
  ov-cache:
  pip-cache:
  gl-cache:
  compute-cache:
